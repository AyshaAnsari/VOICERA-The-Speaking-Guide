<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voicera: My Profile</title>
   
    <link rel="stylesheet" href="style.css">
</head>
<body>
 
<nav class="navbar">
    <div class="logo">VOICERA      
    </div>
    
    <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="journey.html">Journey</a></li>
        <li><a href="#">Chapters</a></li>
        <li><a href="#">Login</a></li>
        <li><a href="signup.html" class="signup-btn">Sign Up</a></li>
        <li><a href="profile.html">Profile</a></li>
    </ul>
</nav>

<section class="profile-section">
    <div class="profile-container" id="profileCard">
        <!-- Content will be injected by JavaScript -->
    </div>
</section>

<script>
    document.addEventListener("DOMContentLoaded", () => {
        const profileCard = document.getElementById("profileCard");
        const userData = localStorage.getItem("voiceraUserProfile");
        
        if (userData) {
            const user = JSON.parse(userData);
            profileCard.innerHTML = `
                <div class="avatar-circle">
                    ${user.name.charAt(0).toUpperCase()}
                </div>
                <h2>${user.name}</h2>
                <p class="email-display">${user.email}</p>
                
                <div class="profile-details">
                    <div class="detail-item">
                        <span class="detail-label">Main Goal:</span>
                        <span class="detail-value">${user.goal}</span>
                    </div>
                    <div class="detail-item">
                        <span class="detail-label">Current Level:</span>
                        <span class="detail-value">${user.level || 'Beginner'}</span>
                    </div>
                </div>
                
                <button id="logoutBtn" class="logout-btn">Log Out</button>
            `;
            
            document.getElementById("logoutBtn").addEventListener("click", () => {
                localStorage.removeItem("voiceraUserProfile");
                window.location.href = "index.html";
            });
        } else {
            profileCard.innerHTML = `
                <h2>No Profile Found</h2>
                <p>It looks like you haven't created an account yet.</p>
                <a href="signup.html" class="start-journey-btn" style="display:inline-block; margin-top: 20px;">Sign Up Now</a>
            `;
        }
    });
</script>

</body>
</html>
