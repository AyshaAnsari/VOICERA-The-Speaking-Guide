<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voicera: Sign Up</title>
   
    <link rel="stylesheet" href="style.css">
</head>
<body>
 
<nav class="navbar">
    <div class="logo">VOICERA      
    </div>
    
    <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="journey.html">Journey</a></li>
        <li><a href="#">Chapters</a></li>
        <li><a href="#">Login</a></li>
        <li><a href="signup.html" class="signup-btn">Sign Up</a></li>
        <li><a href="profile.html">Profile</a></li>
    </ul>
</nav>

<section class="form-section">
    <div class="form-container">
        <h2>Join Voicera</h2>
        <p>Start your speaking journey today.</p>
        
        <form id="signupForm" class="signup-form" action="#" method="POST">
            <div class="input-group">
                <label for="name">Full Name</label>
                <input type="text" id="name" name="name" required placeholder="Enter your full name">
            </div>
            
            <div class="input-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" required placeholder="Enter your email address">
            </div>
            
            <div class="input-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required placeholder="Create a password">
            </div>
            
            <div class="input-group">
                <label for="confirm-password">Confirm Password</label>
                <input type="password" id="confirm-password" name="confirm-password" required placeholder="Confirm your password">
            </div>

            <div class="input-group">
                <label for="goal">Your Main Goal</label>
                <select id="goal" name="goal" required>
                    <option value="" disabled selected>Select a goal...</option>
                    <option value="hesitation">Overcome Hesitation</option>
                    <option value="leadership">Leadership Communication</option>
                    <option value="storytelling">Master Storytelling</option>
                    <option value="public_speaking">Public Speaking</option>
                </select>
            </div>

            <div class="input-group">
                <label for="level">Current Speaking Level</label>
                <select id="level" name="level" required>
                    <option value="" disabled selected>Select your level...</option>
                    <option value="beginner">Beginner</option>
                    <option value="intermediate">Intermediate</option>
                    <option value="advanced">Advanced</option>
                </select>
            </div>
            
            <button type="submit" class="submit-btn">Create Account</button>
            <p class="login-link">Already have an account? <a href="#">Log in here</a></p>
        </form>
    </div>
</section>

<script>
    document.getElementById('signupForm').addEventListener('submit', function(e) {
        e.preventDefault();
        
        const name = document.getElementById('name').value;
        const email = document.getElementById('email').value;
        const goalSelect = document.getElementById('goal');
        const goal = goalSelect.options[goalSelect.selectedIndex].text;
        const levelSelect = document.getElementById('level');
        const level = levelSelect.options[levelSelect.selectedIndex].text;
        
        const userProfile = {
            name: name,
            email: email,
            goal: goal,
            level: level
        };
        
        localStorage.setItem('voiceraUserProfile', JSON.stringify(userProfile));
        
        // Redirect to profile page
        window.location.href = 'profile.html';
    });
</script>
</body>
</html>
